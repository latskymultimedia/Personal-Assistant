<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="data:," />
  <title>Johann's Personal Agent</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      width: 100%;
      background-color: #0e1116;
      color: #eef1f5;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      overflow: hidden;
    }
    .app {
      display: flex;
      flex-direction: column;
      height: 100vh;
      width: 100vw;
    }
    .topbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 10px 16px;
      background-color: #151921;
      border-bottom: 1px solid #262e3d;
      flex-shrink: 0;
    }
    .brand-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .title {
      font-weight: 700;
      font-size: 15px;
      letter-spacing: 0.4px;
      color: #e6b17a;
    }
    .subtitle {
      font-size: 12px;
      color: #9aa5b8;
    }
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }
    select, button, textarea {
      font-family: inherit;
      color: #eef1f5;
      background-color: #1e2530;
      border: 1px solid #323c4f;
      border-radius: 6px;
    }
    select, button {
      padding: 7px 12px;
      font-size: 13px;
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;
    }
    button:hover, select:hover {
      border-color: #e6b17a;
    }
    .primary-btn {
      background-color: #e6b17a;
      color: #101318;
      border-color: #e6b17a;
      font-weight: 700;
      padding: 10px 18px;
      font-size: 14px;
    }
    .main {
      display: flex;
      flex: 1;
      min-height: 0;
      width: 100%;
    }
    .side-left {
      width: 220px;
      background-color: #13171f;
      border-right: 1px solid #262e3d;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      overflow-y: auto;
      flex-shrink: 0;
    }
    .sec-title {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      color: #8f9bb0;
      margin-bottom: 8px;
    }
    .preset-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .preset-btn {
      width: 100%;
      text-align: left;
      white-space: normal;
      line-height: 1.35;
      padding: 8px 10px;
      font-size: 12px;
      background-color: #1a202b;
    }
    .chat-col {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
      height: 100%;
      background-color: #0e1116;
    }
    .chat-col.drag-over {
      outline: 2px dashed #e6b17a;
      outline-offset: -6px;
    }
    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 18px 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .msg {
      max-width: 780px;
      padding: 13px 16px;
      border-radius: 8px;
      line-height: 1.55;
      font-size: 14px;
      white-space: pre-wrap;
      word-wrap: break-word;
    }
    .msg.user {
      align-self: flex-end;
      background-color: #212d3f;
      border: 1px solid #354966;
    }
    .msg.agent {
      align-self: flex-start;
      background-color: #161b24;
      border: 1px solid #273040;
    }
    .msg-role {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.7px;
      color: #e6b17a;
      margin-bottom: 6px;
      text-transform: uppercase;
    }
    .files-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      padding: 0 20px 8px 20px;
    }
    .files-bar:empty {
      display: none;
    }
    .file-chip {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background-color: #1f2734;
      border: 1px solid #354156;
      border-radius: 999px;
      padding: 4px 10px;
      font-size: 12px;
      color: #e6b17a;
    }
    .file-chip button {
      background: none;
      border: none;
      color: #ff8282;
      padding: 0 2px;
      font-weight: 700;
    }
    .composer-wrap {
      padding: 12px 20px 16px 20px;
      background-color: #151921;
      border-top: 1px solid #262e3d;
      flex-shrink: 0;
    }
    .composer {
      display: flex;
      gap: 10px;
      align-items: flex-end;
    }
    textarea {
      flex: 1;
      min-width: 0;
      padding: 11px 13px;
      font-size: 14px;
      line-height: 1.45;
      height: 48px;
      max-height: 150px;
      resize: vertical;
    }
    textarea:focus {
      outline: none;
      border-color: #e6b17a;
    }
    .hint {
      margin-top: 6px;
      font-size: 11px;
      color: #7f8ba1;
    }
    .moves-col {
      width: 280px;
      background-color: #13171f;
      border-left: 1px solid #262e3d;
      padding: 14px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
      flex-shrink: 0;
    }
    .move-item {
      background-color: #1a202b;
      border: 1px solid #2b3446;
      border-left: 3px solid #e6b17a;
      border-radius: 6px;
      padding: 10px;
      font-size: 13px;
      line-height: 1.45;
    }
    .move-item button {
      margin-top: 8px;
      padding: 4px 9px;
      font-size: 11px;
    }
    @media (max-width: 860px) {
      html, body, .app { overflow: auto; height: auto; min-height: 100vh; }
      .main { flex-direction: column; height: auto; }
      .side-left, .moves-col {
        width: 100%;
        border: none;
        border-top: 1px solid #262e3d;
      }
      .chat-col { min-height: 55vh; height: auto; }
      .msg { max-width: 95%; }
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="topbar">
      <div class="brand-wrap">
        <div class="title">JOHANN'S PERSONAL AGENT</div>
        <div class="subtitle">Chief of Staff & Creative Producer</div>
      </div>
      <div class="controls">
        <select id="deptSelect" aria-label="Department">
          <option value="PRODUCER">PRODUCER</option>
          <option value="MARKETING">MARKETING</option>
          <option value="BIZDEV">BIZDEV</option>
          <option value="CAREER">CAREER</option>
          <option value="RESEARCHER">RESEARCHER</option>
          <option value="OPERATOR">OPERATOR</option>
        </select>
        <button type="button" id="briefBtn">Brief Me</button>
        <button type="button" id="attachBtn">Attach File</button>
        <input type="file" id="fileInput" multiple style="display:none;" />
        <button type="button" id="keyBtn">API Key</button>
        <button type="button" id="clearBtn">Clear</button>
      </div>
    </div>

    <div class="main">
      <div class="side-left">
        <div>
          <div class="sec-title">Quick Prompts</div>
          <div class="preset-list">
            <button type="button" class="preset-btn" data-prompt="Audit this attached budget, quote, or brief. Flag numbers, risks, and commercial vs. documentary margin.">Audit Budget / Brief</button>
            <button type="button" class="preset-btn" data-prompt="Turn this script, treatment, or note into a practical production shot plan and next steps.">Script to Shot Plan</button>
            <button type="button" class="preset-btn" data-prompt="Summarize this document and draft a direct, human reply ready for my approval.">Summarize & Draft Reply</button>
            <button type="button" class="preset-btn" data-prompt="Draft a concise outreach pitch positioning Latsky Multimedia for this opportunity.">Draft Outreach Pitch</button>
          </div>
        </div>
      </div>
