<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Johann's Personal Agent</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      background-color: #111317;
      color: #eef1f5;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .app {
      display: flex;
      flex-direction: column;
      height: 100%;
      min-height: 100vh;
    }
    .topbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 12px 16px;
      background-color: #181c22;
      border-bottom: 1px solid #2a303c;
    }
    .title {
      font-weight: 700;
      font-size: 16px;
      color: #e6b17a;
    }
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }
    select, button, textarea {
      font-family: inherit;
      color: #eef1f5;
      background-color: #222832;
      border: 1px solid #343c4b;
      border-radius: 6px;
    }
    select, button {
      padding: 8px 12px;
      font-size: 13px;
      cursor: pointer;
    }
    button:hover, select:hover {
      border-color: #e6b17a;
    }
    .primary-btn {
      background-color: #e6b17a;
      color: #111317;
      border-color: #e6b17a;
      font-weight: 700;
    }
    .main {
      display: flex;
      flex: 1;
      min-height: 0;
    }
    .chat-col {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
    }
    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .msg {
      max-width: 85%;
      padding: 12px 14px;
      border-radius: 8px;
      line-height: 1.5;
      font-size: 14px;
      white-space: pre-wrap;
      word-wrap: break-word;
    }
    .msg.user {
      align-self: flex-end;
      background-color: #253041;
      border: 1px solid #384963;
    }
    .msg.agent {
      align-self: flex-start;
      background-color: #181c22;
      border: 1px solid #2a303c;
    }
    .msg-role {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.6px;
      color: #e6b17a;
      margin-bottom: 6px;
      text-transform: uppercase;
    }
    .files-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      padding: 0 16px 8px 16px;
    }
    .file-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background-color: #222832;
      border: 1px solid #343c4b;
      border-radius: 999px;
      padding: 4px 10px;
      font-size: 12px;
      color: #e6b17a;
    }
    .file-chip button {
      background: none;
      border: none;
      color: #ff7b7b;
      padding: 0 2px;
      font-weight: 700;
    }
    .composer {
      padding: 12px 16px 16px 16px;
      background-color: #181c22;
      border-top: 1px solid #2a303c;
      display: flex;
      gap: 8px;
      align-items: flex-end;
    }
    textarea {
      flex: 1;
      padding: 10px 12px;
      font-size: 14px;
      min-height: 46px;
      max-height: 140px;
      resize: vertical;
    }
    .moves-col {
      width: 300px;
      background-color: #15181e;
      border-left: 1px solid #2a303c;
      padding: 14px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .moves-heading {
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.8px;
      color: #e6b17a;
      text-transform: uppercase;
    }
    .move-item {
      background-color: #1d222b;
      border: 1px solid #2d3544;
      border-left: 3px solid #e6b17a;
      border-radius: 6px;
      padding: 10px;
      font-size: 13px;
      line-height: 1.4;
    }
    .move-item button {
      margin-top: 8px;
      padding: 4px 8px;
      font-size: 11px;
    }
    @media (max-width: 820px) {
      .main { flex-direction: column; }
      .moves-col {
        width: 100%;
        max-height: 220px;
        border-left: none;
        border-top: 1px solid #2a303c;
      }
      .msg { max-width: 95%; }
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="topbar">
      <div class="title">JOHANN'S PERSONAL AGENT</div>
      <div class="controls">
        <select id="deptSelect" aria-label="Department">
          <option value="PRODUCER">PRODUCER</option>
          <option value="MARKETING">MARKETING</option>
          <option value="BIZDEV">BIZDEV</option>
          <option value="CAREER">CAREER</option>
          <option value="RESEARCHER">RESEARCHER</option>
          <option value="OPERATOR">OPERATOR</option>
        </select>
        <button type="button" id="briefBtn">Brief Me</button>
        <button type="button" id="attachBtn">Attach File</button>
        <input type="file" id="fileInput" multiple style="display:none;" />
        <button type="button" id="keyBtn">API Key</button>
        <button type="button" id="clearBtn">Clear</button>
      </div>
    </div>

    <div class="main">
      <div class="chat-col">
        <div class="messages" id="messages">
          <div class="msg agent">
            <div class="msg-role">Chief of Staff</div>Ready. Attach a script, quote, image, audio note, or document—or click "Brief Me" to start.
          </div>
        </div>
        <div class="files-bar" id="filesBar"></div>
        <div class="composer">
          <textarea id="promptInput" placeholder="Write in English or Afrikaans... (Enter to send, Shift+Enter for new line)"></textarea>
          <button type="button" class="primary-btn" id="sendBtn">Send</button>
        </div>
      </div>

      <div class="moves-col">
        <div class="moves-heading">Next Moves</div>
        <div id="movesList"></div>
      </div>
    </div>
  </div>

  <script>
    (function () {
      var SYSTEM_INSTRUCTION = [
        "You are JOHANN'S PERSONAL AGENT: a proactive chief of staff, creative producer and business partner who works on my behalf. You are not a chatbot waiting for orders. You anticipate, prepare and push things forward.",
        "WHO I AM: Johann Latsky, founder of Latsky Multimedia (Cape Town / West Coast). Cinematic documentary and branded content, 20+ years in film, TV, digital and live production. Creator of Verandert, a documentary series and platform profiling community care centres across South Africa. Faculty mentor at AFDA. Bilingual: reply in English or Afrikaans, whichever I write in. Model: commercial work funds mission-driven documentary work.",
        "PERSONALITY: Direct, warm and practical. Storyteller first, cinematic and human, never corporate. Short sentences. Concrete over abstract. No hype, no buzzwords, no flattery. Fact-check before claiming.",
        "RULES: 1. End every substantial response with 'Next moves:' followed by 1 to 3 ranked items. 2. Draft emails, pitches, posts, proposals and lists in full, ready to send; never send, publish or pay anything automatically. 3. Never invent facts, figures, quotes, credits or contacts; mark unverified items and flag legal/financial/contractual items to confirm with a professional."
      ].join("\n");

      var KEY_STORAGE = "johann_agent_gemini_key";
      var pendingFiles = [];
      var nextMoves = [];

      var messagesEl = document.getElementById("messages");
      var filesBarEl = document.getElementById("filesBar");
      var promptEl = document.getElementById("promptInput");
      var fileInputEl = document.getElementById("fileInput");
      var deptEl = document.getElementById("deptSelect");
      var movesListEl = document.getElementById("movesList");

      function getApiKey() {
        try {
          return localStorage.getItem(KEY_STORAGE) || "";
        } catch (e) {
          return "";
        }
      }

      function setApiKey(val) {
        try {
          localStorage.setItem(KEY_STORAGE, val);
        } catch (e) {}
      }

      function addMessage(role, text, fileNames) {
        var wrap = document.createElement("div");
        wrap.className = "msg " + role;

        var label = document.createElement("div");
        label.className = "msg-role";
        label.textContent = role === "user" ? "Johann" : "Chief of Staff";
        wrap.appendChild(label);

        var body = document.createElement("div");
        body.textContent = text;
        wrap.appendChild(body);

        if (fileNames && fileNames.length > 0) {
          var fDiv = document.createElement("div");
          fDiv.style.marginTop = "8px";
          fDiv.style.fontSize = "12px";
          fDiv.style.color = "#e6b17a";
          fDiv.textContent = "Files: " + fileNames.join(", ");
          wrap.appendChild(fDiv);
        }

        messagesEl.appendChild(wrap);
        messagesEl.scrollTop = messagesEl.scrollHeight;
        return body;
      }

      function renderFiles() {
        filesBarEl.innerHTML = "";
        pendingFiles.forEach(function (f, idx) {
          var chip = document.createElement("span");
          chip.className = "file-chip";
          chip.appendChild(document.createTextNode(f.name));

          var rm = document.createElement("button");
          rm.type = "button";
          rm.textContent = "x";
          rm.addEventListener("click", function () {
            pendingFiles.splice(idx, 1);
            renderFiles();
          });

          chip.appendChild(rm);
          filesBarEl.appendChild(chip);
        });
      }

      function isTextFile(file) {
        var name = (file.name || "").toLowerCase();
        return (
          (file.type && (file.type.indexOf("text/") === 0 || file.type === "application/json" || file.type === "application/csv")) ||
          /\.(txt|md|csv|json|srt|vtt|fountain|html|xml|log)$/i.test(name)
        );
      }

      function readSingleFile(file) {
        return new Promise(function (resolve, reject) {
          var reader = new FileReader();
          reader.onerror = function () { reject(new Error("Failed to read " + file.name)); };
          if (isTextFile(file)) {
            reader.onload = function () {
              resolve({
                name: file.name,
                kind: "text",
                textContent: String(reader.result || "")
              });
            };
            reader.readAsText(file);
          } else {
            reader.onload = function () {
              var raw = String(reader.result || "");
              var parts = raw.split(",");
              var base64 = parts.length > 1 ? parts[1] : "";
              var mime = file.type || "application/octet-stream";
              resolve({
                name: file.name,
                kind: "inline",
                mimeType: mime,
                base64: base64
              });
            };
            reader.readAsDataURL(file);
          }
        });
      }

      fileInputEl.addEventListener("change", function (e) {
        var list = Array.prototype.slice.call(e.target.files || []);
        Promise.all(list.map(readSingleFile)).then(function (parsed) {
          pendingFiles = pendingFiles.concat(parsed);
          renderFiles();
          fileInputEl.value = "";
        }).catch(function (err) {
          addMessage("agent", "Upload error: " + err.message);
        });
      });

      function extractNextMoves(replyText) {
        var idx = replyText.toLowerCase().indexOf("next moves");
        if (idx === -1) return;
        var section = replyText.slice(idx);
        var lines = section.split(/\r?\n/);
        lines.forEach(function (line) {
          var cleaned = line.replace(/^.*next moves[:\s-]*/i, "").replace(/^[\s\-*•\d.)]+/, "").trim();
          if (cleaned.length > 4 && nextMoves.indexOf(cleaned) === -1) {
            nextMoves.unshift(cleaned);
          }
        });
        nextMoves = nextMoves.slice(0, 12);
        renderMoves();
      }

      function renderMoves() {
        movesListEl.innerHTML = "";
        nextMoves.forEach(function (m, i) {
          var card = document.createElement("div");
          card.className = "move-
