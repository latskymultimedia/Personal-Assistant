<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="data:," />
  <title>Johann's Personal Agent</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      min-height: 100%;
      width: 100%;
      background-color: #0e1116;
      color: #eef1f5;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    body {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }
    .topbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 12px 16px;
      background-color: #151921;
      border-bottom: 1px solid #262e3d;
    }
    .title { font-weight: 700; font-size: 15px; color: #e6b17a; }
    .subtitle { font-size: 12px; color: #9aa5b8; margin-left: 8px; }
    .controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    select, button, textarea {
      font-family: inherit; color: #eef1f5; background-color: #1e2530;
      border: 1px solid #323c4f; border-radius: 6px;
    }
    select, button { padding: 8px 12px; font-size: 13px; cursor: pointer; }
    button:hover, select:hover { border-color: #e6b17a; }
    .primary-btn {
      background-color: #e6b17a; color: #101318; border-color: #e6b17a;
      font-weight: 700; padding: 10px 18px;
    }
    .desk-grid {
      flex: 1; display: grid; grid-template-columns: 220px 1fr 270px;
      min-height: calc(100vh - 58px);
    }
    .panel-left { background-color: #13171f; border-right: 1px solid #262e3d; padding: 14px; }
    .panel-center { display: flex; flex-direction: column; background-color: #0e1116; min-width: 0; }
    .panel-center.drag-over { outline: 2px dashed #e6b17a; outline-offset: -6px; }
    .panel-right { background-color: #13171f; border-left: 1px solid #262e3d; padding: 14px; }
    .sec-title {
      font-size: 11px; font-weight: 700; letter-spacing: 0.8px;
      text-transform: uppercase; color: #8f9bb0; margin-bottom: 10px;
    }
    .preset-btn {
      display: block; width: 100%; text-align: left; padding: 9px 10px;
      margin-bottom: 8px; font-size: 12px; line-height: 1.35; background-color: #1a202b;
    }
    .messages { flex: 1; padding: 18px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
    .msg {
      max-width: 760px; padding: 12px 15px; border-radius: 8px;
      line-height: 1.55; font-size: 14px; white-space: pre-wrap; word-break: break-word;
    }
    .msg.user { align-self: flex-end; background-color: #212d3f; border: 1px solid #354966; }
    .msg.agent { align-self: flex-start; background-color: #161b24; border: 1px solid #273040; }
    .msg-role { font-size: 11px; font-weight: 700; color: #e6b17a; margin-bottom: 5px; text-transform: uppercase; }
    .files-bar { display: flex; flex-wrap: wrap; gap: 8px; padding: 0 18px 10px 18px; }
    .files-bar:empty { display: none; }
    .file-chip {
      display: inline-flex; align-items: center; gap: 8px; background-color: #1f2734;
      border: 1px solid #354156; border-radius: 999px; padding: 4px 10px; font-size: 12px; color: #e6b17a;
    }
    .file-chip button { background: none; border: none; color: #ff8282; padding: 0 2px; font-weight: 700; }
    .composer-box { padding: 12px 18px 16px 18px; background-color: #151921; border-top: 1px solid #262e3d; }
    .composer-row { display: flex; gap: 10px; align-items: flex-end; }
    textarea {
      flex: 1; min-width: 0; padding: 10px 12px; font-size: 14px;
      line-height: 1.45; height: 52px; max-height: 150px; resize: vertical;
    }
    textarea:focus { outline: none; border-color: #e6b17a; }
    .status-note { margin-top: 6px; font-size: 11px; color: #8b97ad; }
    .move-item {
      background-color: #1a202b; border: 1px solid #2b3446; border-left: 3px solid #e6b17a;
      border-radius: 6px; padding: 10px; margin-bottom: 8px; font-size: 13px; line-height: 1.45;
    }
    .move-item button { margin-top: 8px; padding: 4px 9px; font-size: 11px; }
    @media (max-width: 860px) {
      .desk-grid { grid-template-columns: 1fr; min-height: auto; }
      .panel-left, .panel-right { border: none; border-top: 1px solid #262e3d; }
      .messages { min-height: 260px; }
    }
  </style>
</head>
<body>
  <div class="topbar">
    <div>
      <span class="title">JOHANN'S PERSONAL AGENT</span>
      <span class="subtitle">Chief of Staff & Creative Producer</span>
    </div>
    <div class="controls">
      <select id="deptSelect" aria-label="Department">
        <option value="PRODUCER">PRODUCER</option>
        <option value="MARKETING">MARKETING</option>
        <option value="BIZDEV">BIZDEV</option>
        <option value="CAREER">CAREER</option>
        <option value="RESEARCHER">RESEARCHER</option>
        <option value="OPERATOR">OPERATOR</option>
      </select>
      <button type="button" id="briefBtn">Brief Me</button>
      <button type="button" id="attachBtn">Attach File</button>
      <input type="file" id="fileInput" multiple style="display:none;" />
      <button type="button" id="keyBtn">API Key</button>
      <button type="button" id="clearBtn">Clear</button>
    </div>
  </div>

  <div class="desk-grid">
    <div class="panel-left">
      <div class="sec-title">Quick Prompts</div>
      <button type="button" class="preset-btn" data-prompt="Audit this attached budget, quote, or brief. Flag numbers, risks, and commercial vs. documentary margin.">Audit Budget / Brief</button>
      <button type="button" class="preset-btn" data-prompt="Turn this script, treatment, or note into a practical production shot plan and next steps.">Script to Shot Plan</button>
      <button type="button" class="preset-btn" data-prompt="Summarize this document and draft a direct, human reply ready for my approval.">Summarize & Draft Reply</button>
      <button type="button" class="preset-btn" data-prompt="Draft a concise outreach pitch positioning Latsky Multimedia for this opportunity.">Draft Outreach Pitch</button>
    </div>

    <div class="panel-center" id="panelCenter">
      <div class="messages" id="messages">
        <div class="msg agent">
          <div class="msg-role">Chief of Staff</div>Ready. Drag a file here or click Attach File, pick a department, or hit Brief Me to start.
        </div>
      </div>
      <div class="files-bar" id="filesBar"></div>
      <div class="composer-box">
        <div class="composer-row">
          <textarea id="promptInput" placeholder="Write in English or Afrikaans... (Enter to send, Shift+Enter for new line)"></textarea>
          <button type="button" class="primary-btn" id="sendBtn">Send</button>
        </div>
        <div class="status-note" id="statusNote">Auto-Fallback Engine Active · Drop files or attach scripts, quotes, audio, images, or PDFs.</div>
      </div>
    </div>

    <div class="panel-right">
      <div class="sec-title">Next Moves</div>
      <div id="movesList"></div>
    </div>
  </div>

  <script>
    (function () {
      var SYSTEM_INSTRUCTION = [
        "You are JOHANN'S PERSONAL AGENT: a proactive chief of staff, creative producer and business partner who works on my behalf. You are not a chatbot waiting for orders. You anticipate, prepare and push things forward.",
        "WHO I AM: Johann Latsky, founder of Latsky Multimedia (Cape Town / West Coast). Cinematic documentary and branded content, 20+ years in film, TV, digital and live production. Creator of Verandert, a documentary series and platform profiling community care centres across South Africa. Faculty mentor at AFDA. Bilingual: reply in English or Afrikaans, whichever I write in. Model: commercial work funds mission-driven documentary work.",
        "PERSONALITY: Direct, warm and practical. Storyteller first, cinematic and human, never corporate. Short sentences. Concrete over abstract. No hype, no buzzwords, no flattery. Fact-check before claiming.",
        "RULES: 1. End every substantial response with 'Next moves:' followed by 1 to 3 ranked items. 2. Draft emails, pitches, posts, proposals and lists in full, ready to send; never send, publish or pay anything automatically. 3. Never invent facts, figures, quotes, credits or contacts; mark unverified items and flag legal/financial/contractual items to confirm with a professional."
      ].join("\n");

      var KEY_STORAGE = "johann_agent_gemini_key";
      var MODELS = ["gemini-1.5-flash", "gemini-2.0-flash", "gemini-3.8-flash"];
      var pendingFiles = [];
      var nextMoves = [];

      var messagesEl = document.getElementById("messages");
      var filesBarEl = document.getElementById("filesBar");
      var promptEl = document.getElementById("promptInput");
      var fileInputEl = document.getElementById("fileInput");
      var deptEl = document.getElementById("deptSelect");
      var movesListEl = document.getElementById("movesList");
      var panelCenterEl = document.getElementById("panelCenter");
      var statusNoteEl = document.getElementById("statusNote");

      function getApiKey() {
        try { return localStorage.getItem(KEY_STORAGE) || ""; } catch (e) { return ""; }
      }

      function setApiKey(val) {
        try { localStorage.setItem(KEY_STORAGE, val); } catch (e) {}
      }

      function addMessage(role, text, fileNames) {
        var wrap = document.createElement("div");
        wrap.className = "msg " + role;

        var label = document.createElement("div");
        label.className = "msg-role";
        label.textContent = role === "user" ? "Johann" : "Chief of Staff";
        wrap.appendChild(label);

        var body = document.createElement("div");
        body.textContent = text;
        wrap.appendChild(body);

        if (fileNames && fileNames.length > 0) {
          var fDiv = document.createElement("div");
          fDiv.style.marginTop = "8px";
          fDiv.style.fontSize = "12px";
          fDiv.style.color = "#e6b17a";
          fDiv.textContent = "Attached: " + fileNames.join(", ");
          wrap.appendChild(fDiv);
        }

        messagesEl.appendChild(wrap);
        messagesEl.scrollTop = messagesEl.scrollHeight;
        return body;
      }

      function renderFiles() {
        filesBarEl.innerHTML = "";
        pendingFiles.forEach(function (f, idx) {
          var chip = document.createElement("span");
          chip.className = "file-chip";
          chip.appendChild(document.createTextNode(f.name));

          var rm = document.createElement("button");
          rm.type = "button";
          rm.textContent = "x";
          rm.addEventListener("click", function () {
            pendingFiles.splice(idx, 1);
            renderFiles();
          });

          chip.appendChild(rm);
          filesBarEl.appendChild(chip);
        });
      }

      function isTextFile(file) {
        var name = (file.name || "").toLowerCase();
        return (
          (file.type && (file.type.indexOf("text/") === 0 || file.type === "application/json" || file.type === "application/csv")) ||
          /\.(txt|md|csv|json|srt|vtt|fountain|html|xml|log)$/i.test(name)
        );
      }

      function readSingleFile(file) {
        return new Promise(function (resolve, reject) {
          var reader = new FileReader();
          reader.onerror = function () { reject(new Error("Failed to read " + file.name)); };
          if (isTextFile(file)) {
            reader.onload = function () {
              resolve({ name: file.name, kind: "text", textContent: String(reader.result || "") });
            };
            reader.readAsText(file);
          } else {
            reader.onload = function () {
              var raw = String(reader.result || "");
              var parts = raw.split(",");
              resolve({
                name: file.name,
                kind: "inline",
                mimeType: file.type || "application/octet-stream",
                base64: parts.length > 1 ? parts[1] : ""
              });
            };
            reader.readAsDataURL(file);
          }
        });
      }

      function ingestFileList(rawList) {
        var list = Array.prototype.slice.call(rawList || []);
        if (!list.length) return;
        Promise.all(list.map(readSingleFile)).then(function (parsed) {
          pendingFiles = pendingFiles.concat(parsed);
          renderFiles();
          statusNoteEl.textContent = "Staged " + pendingFiles.length + " file(s) for analysis.";
        }).catch(function (err) {
          addMessage("agent", "Upload error: " + err.message);
        });
      }

      fileInputEl.addEventListener("change", function (e) {
        ingestFileList(e.target.files);
        fileInputEl.value = "";
      });

      panelCenterEl.addEventListener("dragover", function (e) {
        e.preventDefault();
        panelCenterEl.classList.add("drag-over
